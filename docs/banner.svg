<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-label="crossmap: use an iPhone plugged into another Mac, across networks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11161d"/>
      <stop offset="100%" stop-color="#1b2430"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#6ee7c8"/>
    </linearGradient>
  </defs>

  <rect width="880" height="240" rx="14" fill="url(#bg)"/>

  <text x="48" y="62" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="700" fill="#f3f6fa" letter-spacing="-0.5">crossmap</text>
  <text x="48" y="90" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif"
        font-size="15" fill="#9fb0c4">Use an iPhone plugged into another Mac, across networks.</text>

  <!-- iPhone -->
  <rect x="60" y="130" width="42" height="72" rx="8" fill="none" stroke="#6ee7c8" stroke-width="2"/>
  <rect x="74" y="136" width="14" height="3" rx="1.5" fill="#6ee7c8"/>
  <text x="81" y="220" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#9fb0c4">iPhone</text>

  <!-- USB link -->
  <line x1="110" y1="166" x2="188" y2="166" stroke="url(#wire)" stroke-width="2"/>
  <text x="149" y="158" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="10" fill="#6ee7c8">USB</text>

  <!-- Mac B -->
  <rect x="196" y="134" width="118" height="68" rx="7" fill="none" stroke="#4f8cff" stroke-width="2"/>
  <text x="255" y="166" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif"
        font-size="14" font-weight="600" fill="#f3f6fa">Mac B</text>
  <text x="255" y="184" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#4f8cff">agent</text>
  <text x="255" y="220" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#9fb0c4">different network</text>

  <!-- tailnet link -->
  <line x1="322" y1="168" x2="470" y2="168" stroke="url(#wire)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="396" y="158" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="10" fill="#6ee7c8">tailnet</text>

  <!-- Mac A -->
  <rect x="478" y="134" width="118" height="68" rx="7" fill="none" stroke="#4f8cff" stroke-width="2"/>
  <text x="537" y="166" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif"
        font-size="14" font-weight="600" fill="#f3f6fa">Mac A</text>
  <text x="537" y="184" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#4f8cff">host</text>

  <!-- consumers -->
  <line x1="604" y1="168" x2="662" y2="168" stroke="url(#wire)" stroke-width="2"/>
  <rect x="670" y="128" width="152" height="80" rx="7" fill="none" stroke="#6ee7c8" stroke-width="2"/>
  <text x="746" y="156" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="600" fill="#f3f6fa">Xcode</text>
  <text x="746" y="176" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#9fb0c4">devicectl</text>
  <text x="746" y="194" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#9fb0c4">ideviceinstaller</text>
</svg>
