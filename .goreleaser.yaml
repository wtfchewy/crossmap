version: 2
project_name: crossmap

builds:
  # crossmap drives macOS frameworks (usbmuxd, dns-sd, CoreDevice), so
  # darwin is the only platform worth shipping a binary for.
  - main: ./cmd/crossmap
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^ci:", "^chore\\(deps\\)"]
